services:
  scientificoperationscentre.client:
    image: ${DOCKER_REGISTRY-}scientificoperationscentreclient
    container_name: scientificoperationscentreclient
    hostname: localhost
    ports:
        - 9000:9000
    build:
      context: .
      dockerfile: ScientificOperationsCentre.Client/Dockerfile
    # depends_on:
    #     - scientificoperationscentre.api
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
  
