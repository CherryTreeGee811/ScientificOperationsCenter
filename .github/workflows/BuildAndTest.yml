name: ScientificOperationsCentre
on:
   push:
       branches:
           - '*'
   pull_request:
       branches:
           - '*'
   workflow_dispatch:
jobs:
   BuildAndTest:
      runs-on: ubuntu-latest
      steps:
          - uses: actions/checkout@v4
              
          - name: Setup .NET
            uses: actions/setup-dotnet@v4
            with:
              dotnet-version: 9.0.x
          
          - name: Install Tools
            shell: bash
            run: |
              sudo apt update -y
              sudo apt install -y nikto doxygen libxml2-utils
          
          - name: Build and Run App Containers
            shell: bash
            env:
              JWT_KEY: ${{ secrets.JWT_KEY }}
              APP_ENV: "production"
              GROUND_CONTROL_PASS: ${{ secrets.GROUND_CONTROL_PASS }}
            run: docker compose up -d

